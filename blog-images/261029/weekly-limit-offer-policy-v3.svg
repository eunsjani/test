<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">주 3편 제한 개인 쿠폰 정책</title>
  <desc id="desc">확장이 노출 순간을 정하고, 서버가 기존 쿠폰을 우선 반환하거나 새 발급 조건을 검사하며, 결제에서 소유권과 사용 여부를 다시 확인하는 흐름</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172033" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8290a8"/>
    </marker>
    <style>
      text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .eyebrow { font-size: 19px; font-weight: 800; letter-spacing: 2px; fill: #6658c7; }
      .title { font-size: 49px; font-weight: 800; fill: #171b26; }
      .subtitle { font-size: 23px; font-weight: 500; fill: #697386; }
      .section { font-size: 16px; font-weight: 800; letter-spacing: 1.7px; fill: #7b8496; }
      .card-title { font-size: 28px; font-weight: 800; fill: #171b26; }
      .card-subtitle { font-size: 18px; font-weight: 600; fill: #667085; }
      .body { font-size: 19px; font-weight: 600; fill: #3f4757; }
      .small { font-size: 17px; font-weight: 600; fill: #667085; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; fill: #5747bb; }
      .pill { font-size: 16px; font-weight: 800; fill: #394150; }
      .branch-title { font-size: 23px; font-weight: 800; fill: #171b26; }
      .branch-kicker { font-size: 15px; font-weight: 800; letter-spacing: 1px; }
      .white-title { font-size: 25px; font-weight: 800; fill: #ffffff; }
      .white-body { font-size: 18px; font-weight: 600; fill: #f0eeff; }
      .footer-title { font-size: 22px; font-weight: 800; fill: #171b26; }
      .footer-body { font-size: 18px; font-weight: 600; fill: #596274; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f6f7fb"/>
  <circle cx="1515" cy="65" r="235" fill="#eeecff"/>
  <circle cx="55" cy="950" r="180" fill="#eaf6f0"/>

  <text x="70" y="70" class="eyebrow">WEEKLY LIMIT · ACCOUNT-BOUND OFFER</text>
  <text x="70" y="130" class="title">새 발급 정책과 이미 발급된 약속을 분리합니다</text>
  <text x="70" y="174" class="subtitle">확장은 노출 순간을 고르고, 서버는 기존 쿠폰을 우선 확인한 뒤 필요한 경우에만 새 발급 조건을 검사합니다.</text>

  <text x="70" y="225" class="section">01 · TRIGGER</text>
  <text x="450" y="225" class="section">02 · CLAIM / SERVER</text>
  <text x="1190" y="225" class="section">03 · CHECKOUT</text>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="320" height="475" rx="30" fill="#ffffff"/>
  </g>
  <circle cx="112" cy="298" r="22" fill="#eeeaff"/>
  <text x="106" y="306" font-size="20" font-weight="800" fill="#6658c7">1</text>
  <text x="145" y="307" class="card-title">확장이 여는 순간</text>
  <text x="105" y="354" class="card-subtitle">무료 한도 문맥은 확장이 판단</text>

  <rect x="105" y="388" width="250" height="92" rx="18" fill="#f4f5f8" stroke="#e1e4ea" stroke-width="2"/>
  <text x="127" y="423" class="body">마지막 무료 논문 안내</text>
  <text x="127" y="454" class="small">이번 주 2편 사용 후 새 논문</text>

  <rect x="105" y="498" width="250" height="92" rx="18" fill="#f4f5f8" stroke="#e1e4ea" stroke-width="2"/>
  <text x="127" y="533" class="body">주 3편 제한 모달</text>
  <text x="127" y="564" class="small">한도 도달 후 기능 사용</text>

  <rect x="105" y="626" width="250" height="64" rx="17" fill="#eeeaff"/>
  <text x="127" y="666" class="mono">POST /weekly-limit/claim</text>

  <path d="M400 486 H432" stroke="#8290a8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="450" y="250" width="690" height="475" rx="30" fill="#ffffff"/>
  </g>
  <circle cx="492" cy="298" r="22" fill="#e9f7ef"/>
  <text x="486" y="306" font-size="20" font-weight="800" fill="#20875a">2</text>
  <text x="525" y="307" class="card-title">먼저 기존 쿠폰을 찾습니다</text>
  <text x="485" y="348" class="card-subtitle">같은 계정·캠페인의 최신 쿠폰 행을 잠근 뒤 분기</text>

  <rect x="485" y="380" width="620" height="128" rx="22" fill="#edf8f2" stroke="#8fd0ae" stroke-width="2"/>
  <text x="512" y="411" class="branch-kicker" fill="#20875a">EXISTING PROMISE</text>
  <text x="512" y="446" class="branch-title">미사용 · 미만료 쿠폰이 있으면 같은 쿠폰 반환</text>
  <text x="512" y="478" class="small">표시값은 definition_snapshot · 현재 국가/캠페인/정의 값은 재적용하지 않음</text>
  <rect x="915" y="402" width="163" height="33" rx="16" fill="#d5efdf"/>
  <text x="936" y="424" class="pill">남은 시간 그대로</text>

  <rect x="485" y="530" width="620" height="160" rx="22" fill="#f0edff" stroke="#aaa0ef" stroke-width="2"/>
  <text x="512" y="562" class="branch-kicker" fill="#6658c7">NEW ISSUANCE POLICY</text>
  <text x="512" y="597" class="branch-title">기존 쿠폰이 없을 때만 새 발급 조건 검사</text>

  <rect x="512" y="618" width="130" height="37" rx="18" fill="#ffffff"/>
  <text x="530" y="642" class="pill">국가 · CN/TW 제외</text>
  <rect x="652" y="618" width="128" height="37" rx="18" fill="#ffffff"/>
  <text x="675" y="642" class="pill">결제 이력 없음</text>
  <rect x="790" y="618" width="108" height="37" rx="18" fill="#ffffff"/>
  <text x="811" y="642" class="pill">14일 경과</text>
  <rect x="908" y="618" width="170" height="37" rx="18" fill="#ffffff"/>
  <text x="927" y="642" class="pill">활성 개인 할인 정의</text>

  <text x="512" y="678" class="small">통과 → 할인 조건을 쿠폰에 고정 · issued_at부터 24시간 · 부적격이면 INSERT ROLLBACK</text>

  <path d="M1150 486 H1172" stroke="#8290a8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1190" y="250" width="340" height="475" rx="30" fill="#ffffff"/>
  </g>
  <circle cx="1232" cy="298" r="22" fill="#fff0df"/>
  <text x="1226" y="306" font-size="20" font-weight="800" fill="#bd6c16">3</text>
  <text x="1265" y="307" class="card-title">결제에서 다시 확인</text>

  <rect x="1225" y="360" width="270" height="76" rx="18" fill="#f4f5f8"/>
  <text x="1247" y="390" class="body">정기 구독 · 모바일 Toss</text>
  <text x="1247" y="418" class="mono">user_coupon_id</text>

  <rect x="1225" y="452" width="270" height="88" rx="18" fill="#f4f5f8"/>
  <text x="1247" y="483" class="body">웹 Pay Once</text>
  <text x="1247" y="512" class="small">ML 코드 → 소유 쿠폰으로 해석</text>

  <rect x="1225" y="570" width="270" height="120" rx="20" fill="#292344"/>
  <text x="1247" y="602" class="white-title">트랜잭션 재검증</text>
  <text x="1247" y="634" class="white-body">소유자 · 만료 · 취소</text>
  <text x="1247" y="662" class="white-body">first_purchase · 사용 기록</text>

  <g filter="url(#shadow)">
    <rect x="70" y="770" width="1460" height="150" rx="30" fill="#ffffff"/>
  </g>
  <rect x="100" y="801" width="665" height="88" rx="20" fill="#f0edff"/>
  <text x="126" y="834" class="footer-title">발급 전 · 캠페인 정책</text>
  <text x="126" y="866" class="footer-body">국가, 정의 활성 여부, 14일 주기는 “새 쿠폰을 만들지”에만 적용</text>

  <rect x="785" y="801" width="715" height="88" rx="20" fill="#edf8f2"/>
  <text x="811" y="834" class="footer-title">발급 후 · 쿠폰의 약속</text>
  <text x="811" y="866" class="footer-body">국가·캠페인 설정이 바뀌어도 만료까지 유지 · 사용 여부는 redemption이 정본</text>

  <text x="70" y="955" class="small">※ 발급 스냅샷의 첫 결제 조건은 모달 표시와 실제 결제에서 동일하게 다시 확인합니다.</text>
</svg>
